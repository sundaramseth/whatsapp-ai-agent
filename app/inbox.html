<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sundaram | Private Enquiry Inbox</title><style>
body{font:16px system-ui;background:#f5f7fb;color:#142335;margin:0}main{max-width:1000px;margin:40px auto;padding:24px}h1{font-size:30px}input,textarea,button{font:inherit;padding:12px;border:1px solid #b6c2d0;border-radius:8px}button{cursor:pointer;background:#0b746b;color:white}input{max-width:100%;box-sizing:border-box}textarea{width:100%;box-sizing:border-box}article{background:white;padding:20px;margin:16px 0;border:1px solid #dbe3ec;border-radius:12px}.muted{color:#56677b}.actions{display:flex;gap:8px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:12px 0}#notice{white-space:pre-wrap}button:disabled{opacity:.5;cursor:default}
</style></head><body><main><h1>Private customer inbox</h1><p class="muted">Review enquiries, take over conversations and reply within the current customer service window. The access key stays in this page's memory; logging out clears it.</p>
<form id="login"><label>Admin access key <input id="key" type="password" autocomplete="off" required></label><button>Open inbox</button></form>
<div id="controls" hidden><div class="actions"><button id="refresh">Refresh</button><button id="export">Download leads CSV</button><button id="logout">Log out</button></div></div><p id="notice" role="status" aria-live="polite"></p><section id="leads"></section><section id="issues"></section></main>
<script>
let accessKey='';
const notice=document.getElementById('notice');
async function api(path,options={}){const response=await fetch(path,{...options,headers:{Authorization:'Bearer '+accessKey,'Content-Type':'application/json',...options.headers}});if(!response.ok){const error=await response.json().catch(()=>({detail:'Request failed'}));throw Error(typeof error.detail==='string'?error.detail:'Invalid request');}return response;}
function element(tag,text){const e=document.createElement(tag);e.textContent=text;return e;}
async function load(){notice.textContent='Loading…';try{const data=await (await api('/admin/leads?limit=100')).json();const list=document.getElementById('leads');list.replaceChildren();for(const lead of data.leads){const card=element('article','');card.append(element('h2',lead.name||lead.phone),element('p',lead.phone+' · '+lead.stage+(lead.paused?' · Assistant paused':'')),element('pre',lead.last_message||'No text message available'));const actions=element('div','');actions.className='actions';const toggle=element('button',lead.paused?'Resume assistant':'Pause for human');toggle.disabled=!!lead.opted_out;toggle.onclick=async()=>{try{await api('/admin/leads/'+lead.phone,{method:'PATCH',body:JSON.stringify({paused:!lead.paused})});await load();}catch(e){notice.textContent=e.message;}};actions.append(toggle);card.append(actions);const form=element('form','');const label=element('label','Your reply (pauses assistant)');const text=element('textarea','');text.maxLength=3500;text.required=true;label.append(text);const send=element('button','Queue reply');send.type='submit';send.disabled=!!lead.opted_out||Date.now()/1000-lead.last_inbound>=23*3600;form.append(label,send);let pendingId=null,pendingText=null;form.onsubmit=async event=>{event.preventDefault();send.disabled=true;try{if(pendingText!==text.value){pendingId='manual-'+crypto.randomUUID();pendingText=text.value;}await api('/admin/leads/'+lead.phone+'/reply',{method:'POST',body:JSON.stringify({id:pendingId,text:pendingText})});text.value='';pendingId=null;pendingText=null;await load();notice.textContent='Reply queued. Check delivery in Meta/provider inbox; queued does not mean delivered.';}catch(e){notice.textContent=e.message;send.disabled=false;}};card.append(form);list.append(card);}const errors=await (await api('/admin/issues')).json();const section=document.getElementById('issues');section.replaceChildren(element('h2','Delivery issues'));for(const issue of errors.issues)section.append(element('p',issue.phone+' · '+issue.state+' · '+issue.error));notice.textContent=data.leads.length+' recent enquiries loaded.';}catch(e){notice.textContent=e.message;}}
document.getElementById('login').onsubmit=async event=>{event.preventDefault();accessKey=document.getElementById('key').value;document.getElementById('key').value='';try{await api('/admin/leads?limit=1');document.getElementById('login').hidden=true;document.getElementById('controls').hidden=false;await load();}catch(e){accessKey='';notice.textContent=e.message;}};
document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=()=>{accessKey='';document.getElementById('leads').replaceChildren();document.getElementById('issues').replaceChildren();document.getElementById('controls').hidden=true;document.getElementById('login').hidden=false;notice.textContent='Logged out.';};
document.getElementById('export').onclick=async()=>{try{const response=await api('/admin/leads.csv');const url=URL.createObjectURL(await response.blob());const a=document.createElement('a');a.href=url;a.download='whatsapp-leads.csv';a.click();URL.revokeObjectURL(url);}catch(e){notice.textContent=e.message;}};
</script></body></html>
